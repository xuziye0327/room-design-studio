<script>
// Scene vertices use centimetres. The affine camera preserves orthographic isometry.
// Each triangle is [ax,ay,az,bx,by,bz,cx,cy,cz,r,g,b].

const geometry=document.getElementById('geometry');
const labels=document.getElementById('labels');
const status=document.getElementById('status');
const scale=2;
geometry.width=labels.width=scene.width*scale;
geometry.height=labels.height=scene.height*scale;
function color(value) {
  if (typeof value==='string') return value;
  if (Array.isArray(value)) return `rgba(${value[0]},${value[1]},${value[2]},${value.length>3?value[3]/255:1})`;
  return '#000';
}
function drawOverlay() {
  const c=labels.getContext('2d');
  c.scale(scale,scale);
  for (const op of scene.overlay) {
    const a=op.args,k=op.kwargs;

      const anchor=k.anchor||'la';
      c.textAlign=anchor[0]==='m'?'center':anchor[0]==='r'?'right':'left';
      c.textBaseline=anchor[1]==='m'?'middle':anchor[1]==='s'?'alphabetic':anchor[1]==='b'?'bottom':'top';
      c.fillText(a[1],a[0][0],a[0][1]);

      c.beginPath();
      const xy=a[0];
      if(op.type==='line'||op.type==='polygon') {
        const points=Array.isArray(xy[0])?xy:Array.from({length:xy.length/2},(_,i)=>xy.slice(i*2,i*2+2));

        const b=Array.isArray(xy[0])?[...xy[0],...xy[1]]:xy;

      if(op.type==='line') {c.strokeStyle=color(k.fill);c.stroke();}

  const packed=new Float32Array(scene.triangles.length*18);
  let i=0;
  for(const t of scene.triangles)for(let v=0;v<3;v++){
    packed[i++]=t[v*3];packed[i++]=t[v*3+1];packed[i++]=t[v*3+2];
